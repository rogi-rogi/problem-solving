<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>풀이 아카이브 · Problem Solving</title>
<style>
:root{--collection-width:340px;color-scheme:light;--ink:#182334;--muted:#576679;--line:#e1e5eb;--paper:#fafbfd;--accent:#1d6653;font:16px/1.55 "Inter","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}a{color:inherit}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b0862b;outline-offset:2px}
.wrap{width:min(1240px,92%);margin:auto}header{background:#ffffff;color:#182334}nav{display:flex;justify-content:space-between;align-items:center;padding:19px 0;font:14px/1.5 ui-monospace,monospace}nav a{text-decoration:none}nav a:hover{text-decoration:underline}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:30px 0 60px}h2{font-size:21px;margin:0}.platforms{display:grid;gap:3px}.platforms button{padding:9px 10px;text-align:left;border-radius:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px}.platforms button[aria-pressed=true]{background:#eaf0ff;color:#203d91;font-weight:bold}.platforms button:hover,.row:hover{background:#eff3f8}.number,.lang{font:13px ui-monospace,monospace}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.toolbar input,.filter-trigger{min-width:0;padding:9px 11px;border:1px solid #ccd4de;border-radius:5px;background:white;font-size:15px}.toolbar>*{max-width:100%;flex:0 1 auto}.toolbar input{width:200px}.filter{position:relative;width:220px}
.filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;width:100%}
.filter-trigger span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-trigger::after{content:"";width:6px;height:6px;flex:none;border:solid currentColor;border-width:0 1px 1px 0;transform:rotate(45deg);margin:-3px 2px 0 0}
.filter-list{position:absolute;z-index:1;inset:calc(100% + 4px) 0 auto;width:100%;max-height:min(260px,40vh);overflow:auto;background:white;border:1px solid #ccd4de;border-radius:5px;padding:3px}
.filter-list button{display:block;width:100%;padding:6px;text-align:left;font-size:14px;white-space:normal;overflow-wrap:anywhere}
.filter-list button:hover,.filter-list button:focus{background:#edf2fb;outline-offset:-2px}
.filter-list [aria-selected=true]{color:#203d91;font-weight:650}.section-title{display:flex;gap:10px;align-items:baseline}.section-title span,small{color:var(--muted)}.row{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,27%) 85px;gap:14px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line)}.row strong,.cat{overflow-wrap:anywhere}.cat{font-size:14px;color:var(--muted)}.colhead{background:#f1f4f8;font-size:13px;font-weight:600;cursor:default;border-top:1px solid var(--line)}.colhead:hover{background:#f1f4f8}.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}.pager button{border:1px solid var(--line);background:white;padding:5px 13px;border-radius:5px}.pager button:disabled{opacity:.4;cursor:default}dialog{padding:0;width:min(850px,94vw);max-height:86vh;border:1px solid var(--line);border-radius:10px;color:var(--ink)}dialog::backdrop{background:#0c211bc9}.detail{position:relative;padding:18px 56px 18px 22px}.detail form{position:absolute;top:4px;right:4px;margin:0}.detail h2{overflow-wrap:anywhere}#path{display:block;overflow-wrap:anywhere}pre{background:#f5f7fa;color:#243247;margin:0;padding:22px;overflow:auto;tab-size:4;font:14px/1.65 ui-monospace,monospace}.empty{padding:24px;color:var(--muted)}[hidden]{display:none}
@media(max-width:750px){main{display:block;padding-top:18px}.row{grid-template-columns:minmax(0,1fr) minmax(60px,25%) 58px;gap:7px;padding:11px 4px}.cat,.lang{font-size:12px}.detail{padding:12px 56px 12px 12px}}

header{border-bottom:1px solid var(--line)}
.platforms button{justify-content:flex-start;height:50px;box-sizing:border-box}
.collection-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.platforms .number{flex:none;margin-left:auto;padding-left:7px;color:var(--muted)}
.collection-symbol{display:inline-grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:6px;background:#eaf0f6;color:#344c68;font:700 12px/1 ui-monospace,monospace}
.platforms :is([data-key="Baekjoon Online Judge"],[data-key="baekjoon-online-judge"]) .collection-symbol{background:#e2edfa;color:#265079}
.collection-logo{display:block;width:24px;height:24px;object-fit:contain}
@media(max-width:750px){.platforms .number{padding-left:0}}

#collections{background:white;border:0;border-right:1px solid var(--line);border-radius:0;padding:16px 12px;margin:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding-left:10px}
.panel-head h2{font-size:16px}
.panel-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:white;font-size:14px}
.panel-toggle:hover{background:#eff3f8}
.repo-nav{display:flex;align-items:center;gap:8px;min-height:32px}
header nav{padding-block:14px}
#open-panel{min-height:32px;width:32px;padding:0;border:0;font-size:18px}
#open-panel[aria-expanded=true]{background:#eaf0ff;color:#203d91}
#panel-shade{display:none}
@media(min-width:751px){
 body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
 header .wrap{width:auto;margin:0 24px}
 main.wrap{width:100%;margin:0;gap:0;padding:0;min-height:0}
 main:has(#collections[open]){grid-template-columns:var(--collection-width) minmax(0,1fr)}
 #collections{position:static;width:100%;height:100%;max-width:none;max-height:none;overflow:auto}
 main>section{min-width:0;overflow:auto;scrollbar-gutter:stable both-edges}
 .archive-content{
   width:min(1040px,calc(100vw - var(--collection-width) - 64px),calc(100% - 32px));
   margin-inline:auto;
   padding-block:24px 60px;
 }
}
@media(max-width:750px){
 header{position:sticky;top:0;z-index:3;height:61px}
 #collections{position:fixed;z-index:2;inset:61px auto 0 0;width:min(var(--collection-width),94vw);height:calc(100dvh - 61px);max-height:none;overscroll-behavior:contain}
 #collections[open] + #panel-shade{display:block;position:fixed;z-index:1;inset:61px 0 0;background:#18233466}
 body:has(#collections[open]){overflow:hidden}
}
dialog .modal-close{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:6px;background:transparent;color:#b12637;font:26px/1 Arial,sans-serif}
dialog .modal-close:hover{color:#861d2a}
dialog .modal-close:focus-visible{outline:3px solid #223c78;outline-offset:3px}
#viewer{height:min(620px,86dvh);background:#fff}
#viewer[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#viewer pre{min-width:0;min-height:0;border-top:1px solid var(--line)}
#viewer::backdrop{background:rgb(25 35 51 / 42%)}
.file-nav{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;border-top:1px solid var(--line)}
.file-nav button{width:44px;height:40px;border-radius:6px;font:24px/1 system-ui;color:#284981}
.file-nav button:hover:enabled{background:#eaf0ff}
.file-nav button:disabled{opacity:.3;cursor:default}
#source .comment{color:#58697b;font-style:italic}
#source :is(.keyword,.atrule,.directive,.boolean){color:#74399c}
#source :is(.string,.char,.attr-value){color:#28623d}
#source :is(.number,.constant){color:#8d4919}
#source :is(.function,.builtin,.class-name){color:#185b91}
#source :is(.operator,.symbol){color:#176669}
#source .punctuation{color:#475872}
.category-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));align-items:start;gap:12px}
.category-card{border:1px solid var(--line);border-radius:8px;background:white;overflow-wrap:anywhere}
.category-card summary{cursor:pointer;padding:16px;font-weight:650}
.category-card summary::marker{color:#536880}
.category-card small{display:block;margin-top:4px;font-weight:400}
.category-card button{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;border-top:1px solid var(--line);padding:9px 14px;text-align:left}
.category-card button:hover{background:#eff3f8}
.category-card button .lang{color:var(--muted)}
</style></head><body>
<header><div class="wrap"><nav><div class="repo-nav"><button class="panel-toggle" id="open-panel" aria-controls="collections" aria-expanded="false" aria-label="컬렉션 열기" title="컬렉션 열기"><span aria-hidden="true">☰</span></button><span>rogi-rogi / problem-solving</span></div><a href="https://github.com/rogi-rogi/problem-solving">GitHub</a></nav></div></header>
<main class="wrap"><dialog id="collections" aria-labelledby="collections-title">
<div class="panel-head"><h2 id="collections-title">컬렉션</h2><button class="panel-toggle" id="close-panel" aria-label="컬렉션 접기" title="컬렉션 접기">←</button></div>
<div class="platforms" id="platforms"></div></dialog><div id="panel-shade" aria-hidden="true"></div>
<section><div class="archive-content"><div class="section-title"><h2 id="heading">전체 파일</h2><span id="count" aria-live="polite"></span></div>
<div class="toolbar"><input id="search" type="search" placeholder="번호·이름·경로 검색" aria-label="문제 검색"><div class="filter"><button class="filter-trigger" id="category" aria-haspopup="listbox" aria-controls="category-list" aria-expanded="false"><span>전체 분류</span></button><div class="filter-list" id="category-list" role="listbox" aria-label="분류" hidden></div></div></div>
<div id="columns" class="row colhead"><span>파일명</span><span>분류</span><span>언어</span></div><div id="list"></div>
<div id="pager" class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div></div></section></main>
<dialog id="viewer" aria-labelledby="filename"><div class="detail"><div><h2 id="filename"></h2><small id="path"></small></div><form method="dialog"><button class="modal-close" aria-label="닫기" autofocus>×</button></form></div><pre><code id="source"></code></pre>
<div class="file-nav">
<button id="previous-file" aria-label="이전 파일" title="이전 파일">←</button>
<button id="next-file" aria-label="다음 파일" title="다음 파일">→</button>
</div></dialog>
<script data-manual>PRISM_BUNDLE</script>
<script type="application/json" id="data">ARCHIVE_DATA</script>
<script>
const records=JSON.parse(document.getElementById('data').textContent);
const el=id=>document.getElementById(id);
const num=n=>n.toLocaleString('ko-KR');
const make=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n};
const tally=key=>{const counts=new Map();for(const row of records)counts.set(row[key],(counts.get(row[key])||0)+1);return counts};
const collections=tally('platform');
const panel = el('collections');
const openPanel = el('open-panel');
const narrowScreen = matchMedia('(max-width:750px)');
function syncPanelButton(){
 const label = panel.open ? '컬렉션 접기' : '컬렉션 열기';
 openPanel.setAttribute('aria-label', label);
 openPanel.title = label;
 document.querySelector('main > section').inert = panel.open && narrowScreen.matches;
 openPanel.setAttribute('aria-expanded', String(panel.open));
}
function openCollections(){
 panel.show();
 syncPanelButton();
}
panel.addEventListener('close', () => {
 syncPanelButton();
 if (!panel.open) openPanel.focus({preventScroll:true});
});
openPanel.onclick = () => panel.open ? panel.close() : openCollections();
el('panel-shade').onclick = () => panel.close();
document.addEventListener('keydown', event => {
 if (event.key === 'Escape' && narrowScreen.matches && panel.open) panel.close();
});
el('close-panel').onclick = () => panel.close();
narrowScreen.addEventListener('change', () => {
 if (panel.open) panel.close();
 if (!narrowScreen.matches) openCollections();
});
if (!narrowScreen.matches) openCollections();
let platform='',page=0;
const pageSize=25;
function closeFilter(trigger){
 el(trigger.getAttribute('aria-controls')).hidden = true;
 trigger.setAttribute('aria-expanded','false');
}
const triggers = document.querySelectorAll('.filter-trigger');
for (const trigger of triggers){
 const list = el(trigger.getAttribute('aria-controls'));
 function openList(){
   for (const other of triggers) closeFilter(other);
   list.hidden = false;
   trigger.setAttribute('aria-expanded','true');
   list.querySelector('[aria-selected=true]').focus();
 }
 trigger.onclick = () => list.hidden ? openList() : closeFilter(trigger);
 trigger.onkeydown = event => {
   if (['ArrowDown','ArrowUp'].includes(event.key)){ event.preventDefault(); openList(); }
 };
 list.onkeydown = event => {
   const option = event.target;
   const targets = {ArrowDown:option.nextElementSibling,ArrowUp:option.previousElementSibling,
                    Home:list.firstElementChild,End:list.lastElementChild};
   if (event.key in targets){ event.preventDefault(); (targets[event.key] || option).focus(); }
   if (event.key === 'Escape'){ event.preventDefault(); closeFilter(trigger); trigger.focus(); }
 };
 trigger.parentElement.onfocusout = event => {
   if (!trigger.parentElement.contains(event.relatedTarget)) closeFilter(trigger);
 };
}
document.addEventListener('pointerdown', event => {
 for (const trigger of triggers) if (!trigger.parentElement.contains(event.target)) closeFilter(trigger);
});
function options(id,label,values){
 const trigger = el(id), list = el(id + '-list');
 closeFilter(trigger);
 list.replaceChildren();
 function select(value){
   trigger.value = value;
   trigger.firstElementChild.textContent = value || label;
   trigger.setAttribute('aria-label', label.slice(3) + ' 선택, ' + (value || label));
 }
 select('');
 for (const value of ['', ...values]){
   const option = make('button',value || label);
   option.setAttribute('role','option');
   option.setAttribute('aria-selected',String(value === ''));
   option.tabIndex = -1;
   option.onclick = () => {
     list.querySelector('[aria-selected=true]').setAttribute('aria-selected','false');
     option.setAttribute('aria-selected','true');
     select(value);
     closeFilter(trigger);
     trigger.focus();
     page = 0;
     render();
   };
   list.append(option);
 }
}
function choose(value){
 platform=value;page=0;
 const scope=records.filter(r=>!platform||r.platform===platform);
 options('category','전체 분류',[...new Set(scope.map(r=>r.category).filter(Boolean))].sort());
 el('heading').textContent=value||'전체 파일';
 for(const b of el('platforms').children)b.setAttribute('aria-pressed',String(b.dataset.key===value));render()
}
/* Tabler Icons
ICON_LICENSE
*/
const collectionIcons = COLLECTION_ICONS;
for(const [key,n] of [['',records.length],...collections]){
 const button = make('button','');
 button.dataset.key = key;
 const badge = make('span','','collection-symbol');
 badge.setAttribute('aria-hidden','true');
 if (collectionIcons[key]) {
   const logo = document.createElement('img');
   logo.src = collectionIcons[key];
   logo.alt = '';
   logo.className = 'collection-logo';
   badge.append(logo);
 } else {
   badge.textContent = /^baekjoon[ -]online[ -]judge$/i.test(key) ? 'BOJ' : key.slice(0,2).toUpperCase();
 }
 button.append(badge);
 button.append(make('span',key||'전체 파일','collection-name'),make('span',num(n),'number'));
 button.onclick = () => {
   choose(key);
   if (narrowScreen.matches) panel.close();
 };
 el('platforms').append(button);
}
let rows = [];
let fileIndex = 0;
// Prism has no bundled grammars for these two archive languages.
Prism.languages.golfscript = {
 comment: /#.*/,
 string: /'(?:\\[\s\S]|[^'\\])*'|"(?:\\[\s\S]|[^"\\])*"/,
 number: /-?\d+/,
 punctuation: /[{}\[\]]/,
 operator: /[^\w\s]/
};
Prism.languages.algol68 = {
 comment: /#[^#]*#|\bCOMMENT\b[\s\S]*?\bCOMMENT\b/i,
 string: /"(?:[^"]|"")*"/,
 keyword: /\b(?:begin|end|if|then|else|fi|for|from|by|to|while|do|od|proc|int|real|bool|char|string|ref|mode)\b/i,
 builtin: /\b(?:print|read|newline)\b/i,
 number: /\b\d+(?:\.\d+)?\b/,
 punctuation: /[(),;]/
};
const grammarNames = {'C++':'cpp', 'Visual Basic':'visual-basic', 'ALGOL 68':'algol68'};
function showFile(index){
 const row = rows[index];
 const viewer = el('viewer');
 fileIndex = index;
 el('filename').textContent = row.name;
 el('path').textContent = row.path;
 const code = el('source');
 const language = grammarNames[row.language] || row.language.toLowerCase();
 const grammar = Prism.languages[language];
 if (grammar) {
   code.innerHTML = Prism.highlight(row.source, grammar, language);
 } else {
   code.textContent = row.source;
 }
 el('previous-file').disabled = index === 0;
 el('next-file').disabled = index === rows.length - 1;
 if (!viewer.open) viewer.showModal();
 viewer.querySelector('pre').scrollTo(0, 0);
}
el('previous-file').onclick = () => showFile(fileIndex - 1);
el('next-file').onclick = () => showFile(fileIndex + 1);
function renderCategoryCards(expanded){
 const cards = new Map();
 rows.forEach((row, index) => {
   const name = row.category || '기본 폴더';
   if (!cards.has(name)) cards.set(name, []);
   cards.get(name).push(index);
 });
 for (const [name, indices] of cards){
   const card = make('details', '', 'category-card');
   card.open = expanded;
   const title = make('summary', name);
   title.append(make('small', '파일 ' + indices.length + '개'));
   card.append(title);
   for (const index of indices){
     const row = rows[index];
     const button = make('button', '');
     button.append(make('span', row.name), make('span', row.language, 'lang'));
     button.onclick = () => showFile(index);
     card.append(button);
   }
   el('list').append(card);
 }
}
function render(){
 const query=el('search').value.trim().normalize().toLowerCase();
 rows=records.filter(r=>(!platform||r.platform===platform)&&(!el('category').value||r.category===el('category').value)&&r.path.normalize().toLowerCase().includes(query));
 const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);
 el('count').textContent=num(rows.length)+'개';el('list').replaceChildren();
 const byCategory = platform === 'Algorithm';
 el('columns').hidden = el('pager').hidden = byCategory;
 el('list').classList.toggle('category-cards', byCategory);
 if (byCategory) {
   renderCategoryCards(Boolean(query || el('category').value));
 } else for(let i=page*pageSize;i<Math.min((page+1)*pageSize,rows.length);i++){
   const r=rows[i];
   const b=make('button','','row');b.append(make('strong',r.name),make('span',r.category||r.platform,'cat'),make('span',r.language,'lang'));b.onclick=()=>showFile(i);el('list').append(b)
 }
 if(!rows.length)el('list').append(make('p','조건에 맞는 파일이 없어요.','empty'));
 el('page').textContent=(page+1)+' / '+pages;el('prev').disabled=page===0;el('next').disabled=page+1>=pages
}
el('prev').onclick=()=>{page--;render()};el('next').onclick=()=>{page++;render()};
el('search').addEventListener('input',()=>{page=0;render()});
// A drag that starts inside the dialog should not dismiss it.
for (const dialog of document.querySelectorAll('dialog')) {
 function onBackdrop(event) {
   const {left, right, top, bottom} = dialog.getBoundingClientRect();
   return event.target === dialog && (event.clientX < left || event.clientX >= right ||
          event.clientY < top || event.clientY >= bottom);
 }
 let startedOutside = false;
 dialog.addEventListener('pointerdown', event => { startedOutside = onBackdrop(event); });
 dialog.addEventListener('click', event => {
   if (startedOutside && onBackdrop(event)) dialog.close();
   startedOutside = false;
 });
}
choose('');
</script></body></html>
