name: BOJ 난이도 분류

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 09:00 KST
  workflow_dispatch:
    inputs:
      operation:
        description: 실행할 작업
        type: choice
        default: sync
        options:
          - sync
          - classify-backup

permissions:
  contents: write

concurrency:
  group: boj-tiers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 난이도 조회 및 분류
        id: classify
        env:
          SOLVED_AC_CLIENT_ID: ${{ secrets.SOLVED_AC_CLIENT_ID }}
          SOLVED_AC_CLIENT_SECRET: ${{ secrets.SOLVED_AC_CLIENT_SECRET }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == "classify-backup" ]]; then
            python3 -B .github/scripts/boj-tier-sync/classify_backup.py
          else
            python3 -B .github/scripts/boj-tier-sync/sync_tiers.py
          fi

      - name: 이동 및 실행 기록 저장
        if: ${{ !cancelled() && steps.classify.outcome != 'skipped' }}
        run: |
          git add -A -- baekjoon-online-judge
          if [[ -d other/solved ]] || git ls-files other/solved | grep . >/dev/null; then
            git add -A -- other/solved
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: classify BOJ solutions by solved.ac tier"
          git push
